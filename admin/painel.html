<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo</title>

    <link href="/css/output.css" rel="stylesheet" />
  </head>

  <body class="bg-gray-100 min-h-screen" x-data="dashboardAdmin()">
    <nav class="bg-brand-blue text-white p-4 shadow-md">
      <div
        class="container mx-auto flex justify-between items-center max-w-6xl"
      >
        <h1 class="font-bold text-xl flex items-center gap-3">
          <img
            src="https://res.cloudinary.com/dc0qqgkmp/image/upload/v1753121735/contato/logo-contato__xnri7i.svg"
            class="h-8 filter brightness-0 invert"
            alt="Logo"
          />

          <span>Painel Administrativo</span>
        </h1>

        <div class="flex items-center gap-4">
          <a
            href="/"
            target="_blank"
            class="hover:text-brand-yellow transition-colors"
          >
            Ver Site
          </a>

          <button
            @click="logout()"
            class="bg-white text-brand-blue px-4 py-2 rounded-lg font-bold hover:bg-gray-200"
          >
            Sair
          </button>
        </div>
      </div>
    </nav>

    <main class="container mx-auto max-w-6xl p-6">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h2 class="text-3xl font-black text-brand-blue">Gestão de Artigos</h2>

          <p class="text-gray-600 mt-1">
            Gerencie notícias e conteúdos publicados.
          </p>
        </div>

        <a
          href="/admin/editor.html"
          class="bg-brand-yellow text-black font-black px-6 py-3 rounded-xl hover:scale-105 transition-transform shadow-lg"
        >
          + Novo Artigo
        </a>
      </div>

      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50 border-b">
            <tr>
              <th class="text-left px-6 py-4">Título</th>
              <th class="text-left px-6 py-4">Status</th>
              <th class="text-left px-6 py-4">Data</th>
              <th class="text-right px-6 py-4">Ações</th>
            </tr>
          </thead>

          <tbody>
            <template x-for="artigo in artigos" :key="artigo.id">
              <tr class="border-b hover:bg-gray-50">
                <td class="px-6 py-4 font-semibold" x-text="artigo.titulo"></td>

                <td class="px-6 py-4">
                  <span
                    x-show="artigo.publicado"
                    class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-bold"
                  >
                    Publicado
                  </span>

                  <span
                    x-show="!artigo.publicado"
                    class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-sm font-bold"
                  >
                    Rascunho
                  </span>
                </td>

                <td
                  class="px-6 py-4 text-gray-500"
                  x-text="formatarData(artigo.created_at)"
                ></td>

                <td class="px-6 py-4">
                  <div class="flex justify-end gap-3">
                    <a
                      :href="'/admin/editor.html?id=' + artigo.id"
                      class="text-brand-blue hover:text-brand-yellow font-bold"
                    >
                      Editar
                    </a>

                    <button
                      @click="excluirArtigo(artigo.id)"
                      class="text-red-600 hover:text-red-800 font-bold"
                    >
                      Excluir
                    </button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>

        <div
          x-show="artigos.length === 0"
          class="text-center py-20 text-gray-400"
        >
          Nenhum artigo encontrado.
        </div>
      </div>
    </main>

    <script type="module" src="/js/painel.js"></script>
  </body>
</html>
```
