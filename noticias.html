<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog e Notícias - Contato Contabilidade</title>
    <link href="./css/output.css" rel="stylesheet" />
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-gray-50 font-sans text-gray-800" x-data="listaNoticias()">
    <header class="bg-brand-blue text-white py-2 shadow-md">
      <div
        class="container mx-auto px-6 max-w-6xl flex justify-between items-center"
      >
        <a
          href="/"
          class="flex items-center gap-3 hover:opacity-80 transition-opacity"
        >
          <img
            src="https://res.cloudinary.com/dc0qqgkmp/image/upload/v1753121735/contato/logo-contato__xnri7i.svg"
            class="h-16 md:h-20 w-auto filter brightness-0 invert"
            alt="Logo Contato"
          />
        </a>
        <nav>
          <a
            href="/"
            class="text-white font-semibold hover:text-brand-yellow transition-colors"
            >← Voltar ao site</a
          >
        </nav>
      </div>
    </header>

    <main class="container mx-auto px-6 max-w-6xl py-12 min-h-screen">
      <div class="mb-12 border-l-4 border-brand-yellow pl-4">
        <h1 class="text-4xl font-black text-brand-blue">Últimas Notícias</h1>
        <p class="text-gray-600 mt-2">
          Acompanhe as novidades e dicas contábeis para o seu negócio.
        </p>
      </div>

      <div x-show="carregando" class="flex justify-center items-center py-20">
        <svg
          class="animate-spin h-10 w-10 text-brand-blue"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
      </div>

      <div
        x-show="erro"
        x-text="erro"
        x-cloak
        class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative"
        role="alert"
      ></div>

      <div
        x-show="!carregando && artigos.length > 0"
        x-cloak
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
      >
        <template x-for="artigo in artigos" :key="artigo.id">
          <article
            class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden flex flex-col border border-gray-100 group"
          >
            <template x-if="artigo.imagem_capa?.trim()">
              <div class="h-48 overflow-hidden">
                <img
                  :src="artigo.imagem_capa"
                  loading="lazy"
                  :alt="artigo.titulo"
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                />
              </div>
            </template>

            <template x-if="!artigo.imagem_capa?.trim()">
              <div
                class="h-48 bg-gradient-to-br from-brand-blue to-blue-900 flex items-center justify-center"
              >
                <svg
                  class="w-12 h-12 text-white opacity-20"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
                  ></path>
                </svg>
              </div>
            </template>

            <div class="p-6 flex flex-col flex-grow">
              <span
                class="text-xs font-bold text-brand-yellow mb-2 uppercase tracking-wider"
                x-text="formatarData(artigo.created_at)"
              ></span>
              <h2
                class="text-xl font-bold text-gray-900 mb-3 leading-tight group-hover:text-brand-blue transition-colors"
                x-text="artigo.titulo"
              ></h2>
              <p
                class="text-gray-600 text-sm mb-6 flex-grow line-clamp-3"
                x-text="artigo.resumo"
              ></p>

              <a
                :href="'/artigo.html?slug=' + artigo.slug"
                class="inline-flex items-center gap-2 text-brand-blue font-bold hover:text-brand-yellow transition-colors"
              >
                Ler artigo completo
                <svg
                  class="w-4 h-4 group-hover:translate-x-1 transition-transform"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M14 5l7 7m0 0l-7 7m7-7H3"
                  ></path>
                </svg>
              </a>
            </div>
          </article>
        </template>
      </div>

      <div
        x-show="!carregando && artigos.length === 0"
        x-cloak
        class="text-center py-20"
      >
        <p class="text-xl text-gray-500">Nenhum artigo publicado ainda.</p>
      </div>
    </main>

    <script type="module">
      import { supabase } from "./js/supabase.js";
      import Alpine from "https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/module.esm.js";

      Alpine.data("listaNoticias", () => ({
        artigos: [],
        carregando: true,
        erro: "",

        async init() {
          try {
            // Puxa as notícias que estão públicas
            const { data, error } = await supabase
              .from("artigos")
              .select("id, titulo, slug, resumo, imagem_capa, created_at")
              .eq("publicado", true) // Garante que só puxa os publicados
              .order("created_at", { ascending: false }); // Do mais recente pro mais antigo

            if (error) throw error;
            this.artigos = data;
          } catch (err) {
            console.error("Erro ao buscar notícias:", err);
            this.erro =
              "Não foi possível carregar as notícias. Tente novamente mais tarde.";
          } finally {
            this.carregando = false;
          }
        },

        // Função para formatar a data que vem do banco (Ex: 2026-05-07 -> 07/05/2026)
        formatarData(dataIso) {
          if (!dataIso) return "";
          const data = new Date(dataIso);
          return data.toLocaleDateString("pt-BR");
        },
      }));

      window.Alpine = Alpine;
      Alpine.start();
    </script>
  </body>
</html>
